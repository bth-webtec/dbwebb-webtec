name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Verify tag matches package.json version
        run: |
          if [ "$(node -p "require('./package.json').version")" != "${GITHUB_REF_NAME#v}" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $(node -p "require('./package.json').version")"
            exit 1
          fi

      # actions/setup-node's node 20 bundles an npm older than 11.5.1,
      # which predates Trusted Publishing (OIDC) support.
      - run: npm install -g npm@latest

      - run: npm publish
